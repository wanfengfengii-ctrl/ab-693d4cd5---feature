server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点
    location = /healthz/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 纯前端单页应用：静态资源直出，未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
